<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씨앗도둑 | 스토리보드 리뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* storyboard review kit — lightbox: filmstrip rail | panel stage | edit sheet. dark so charcoal reads true */
  --bg: #19191b;
  --surface: #222225;
  --line: #333337;
  --ink: #ebe8e1;
  --muted: #9b978e;
  --accent: #d6a75a;
  --narr: #d77a72;
  --st-todo: #6f6c66; --st-ok: #6fae80; --st-draft: #d9a441; --st-requested: #d5625a; --st-working: #a98be0; --st-done: #6d9fd6;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; align-items: center; gap: 12px 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; font-weight: 900; margin: 0; letter-spacing: -0.01em; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { color: var(--ink); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.spacer { flex: 1; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 700; }
.save { font-size: 13px; color: var(--muted); }
.save.err { color: var(--st-requested); }
.agent { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.agent .dot { background: var(--st-todo); }
.agent.on .dot { background: var(--st-ok); }
.agent.stale .dot { background: var(--st-draft); }
.agent.busy .dot { background: var(--st-working); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.main { display: grid; grid-template-columns: 210px 1fr 420px; min-height: 0; }
.main.wide { grid-template-columns: 0 1fr 0; }
.main.wide .rail, .main.wide .sheet { display: none; }
.main.wide .frame img { max-height: 78vh; }

.rail { overflow-y: auto; border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.rail h2 { font-size: 12px; color: var(--muted); font-weight: 500; margin: 10px 2px 2px; }
.thumb { flex: none; display: grid; grid-template-columns: 4px 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); cursor: pointer; padding: 0; text-align: left; }
.thumb.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.thumb .stripe { background: var(--st-todo); }
.thumb .body { display: grid; gap: 4px; padding: 6px; }
.thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; border-radius: 3px; }
.thumb .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.thumb .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }

.stage { display: flex; flex-direction: column; min-height: 0; padding: 16px 20px; gap: 12px; overflow-y: auto; }
.stagebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cutid { font-weight: 900; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.scene { color: var(--muted); font-size: 14px; }
.frame { flex: none; display: block; position: relative; }
.frame img { display: block; margin: 0 auto; max-width: 100%; max-height: 62vh; width: auto; height: auto; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.45); background: #f3f0ea; }
.frame .badge { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(25,25,27,.85); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; display: none; }
.frame.old .badge { display: block; }
.preview { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; max-width: 980px; }
.preview .cam { color: var(--muted); font-size: 14px; }
.preview .ln { display: grid; grid-template-columns: 110px 1fr; gap: 10px; font-size: 16px; }
.preview .ln .spk { font-weight: 700; }
.preview .ln .par { color: var(--muted); font-size: 14px; }
.preview .ln.n { color: var(--narr); }
.preview .act { color: var(--muted); font-size: 15px; }

.sheet { overflow-y: auto; border-left: 1px solid var(--line); padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.statusrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stbadge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.stbadge.working .dot { animation: pulse 1.2s ease-in-out infinite; }
.seg { display: inline-flex; gap: 6px; margin-left: auto; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { border-color: currentColor; font-weight: 700; }
.sendbox { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #1d1d20; }
.sendbox .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sendbox .btn.primary { flex: 1; padding: 9px 12px; }
.reply { font-size: 13px; border-radius: 8px; padding: 8px 10px; border: 1px solid var(--line); white-space: pre-wrap; }
.reply.working { border-color: var(--st-working); color: var(--st-working); }
.reply.done { border-color: var(--st-done); color: var(--st-done); }
.reply.requested { border-color: var(--st-requested); color: var(--st-requested); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field input, .field textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.field textarea { resize: vertical; line-height: 1.7; }
.field.changed input, .field.changed textarea { border-color: var(--st-draft); }
.orig { font-size: 12px; color: var(--muted); display: none; gap: 8px; align-items: baseline; }
.field.changed .orig { display: flex; }
.orig span { white-space: pre-wrap; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; white-space: nowrap; }
.hint { font-size: 12px; color: var(--muted); }
.memo textarea { border-color: #4a4538; }

.grid { display: none; overflow-y: auto; padding: 18px; }
.app.gridmode .main { display: none; }
.app.gridmode .grid { display: block; }
.grid section { margin-bottom: 26px; }
.grid h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: grid; grid-template-rows: auto auto; text-align: left; padding: 0; }
.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.card .cbody { padding: 10px 12px; display: grid; gap: 4px; border-top: 4px solid var(--st-todo); }
.card .top { display: flex; justify-content: space-between; align-items: center; }
.card .top b { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.card .txt { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .memo-p { font-size: 13px; color: var(--st-draft); }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.open { display: flex; }
.modal .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(720px, 100%); display: grid; gap: 10px; }
.modal textarea { width: 100%; height: 340px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; display: none; }
.toast.show { display: block; }

@media (max-width: 1100px) {
  .main, .main.wide { display: block; overflow-y: auto; }
  .stage, .sheet { min-height: auto; }
  .rail { flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail h2 { display: none; }
  .thumb { width: 132px; }
  .frame img { max-height: 50vh; }
  .stage { overflow: visible; }
  .sheet { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
}
@media (max-width: 420px) { .preview .ln { grid-template-columns: 1fr; gap: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 id="title"></h1>
    <span id="chips"></span>
    <div class="counts" id="counts"></div>
    <div class="spacer"></div>
    <span class="agent" id="agent" title="AI 수정 요청 동기화 상태"><span class="dot"></span><span id="agentTxt">공유 DB 연결 확인 중…</span></span>
    <span class="save" id="save">저장소 연결 중…</span>
    <button class="btn" id="btnGrid" type="button">전체 보기</button>
    <button class="btn" id="btnWide" type="button">그림 크게</button>
    <button class="btn" id="btnCopy" type="button">수정 목록 복사</button>
  </header>
  <div class="main" id="main">
    <nav class="rail" id="rail" aria-label="컷 목록"></nav>
    <div class="stage">
      <div class="stagebar">
        <button class="btn" id="prev" type="button" aria-label="이전 컷">◀</button>
        <span class="cutid" id="cutid"></span>
        <button class="btn" id="next" type="button" aria-label="다음 컷">▶</button>
        <span class="scene" id="scene"></span>
        <div class="spacer"></div>
        <button class="btn" id="btnOld" type="button" hidden>이전 그림 누르고 보기</button>
        <button class="btn" id="btnUpload" type="button" title="현재 컷 이미지 등록">그림 업로드</button>
        <input id="imageUpload" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <span class="hint">← → 키로 컷 이동</span>
      </div>
      <div class="frame" id="frame"><img id="img" alt=""><span class="badge">이전 그림</span></div>
      <div class="preview" id="preview"></div>
    </div>
    <aside class="sheet" id="sheet">
      <div class="statusrow">
        <span class="stbadge" id="stbadge"><span class="dot"></span><span></span></span>
        <div class="seg" id="seg">
          <button type="button" data-k="todo"><span class="dot" style="background:var(--st-todo)"></span>미검토</button>
          <button type="button" data-k="ok"><span class="dot" style="background:var(--st-ok)"></span>통과</button>
        </div>
      </div>
      <div class="sendbox">
        <div class="field memo" id="f-memo">
          <label for="in-memo">수정 요청 <span class="hint">그림·연출을 어떻게 바꿀지</span></label>
          <textarea id="in-memo" rows="3" placeholder="예: 클로에 표정이 너무 무섭다, 살짝 미소 남기기 / 라이언을 화면 왼쪽으로"></textarea>
        </div>
        <div class="row">
          <button class="btn primary" id="btnSend" type="button">수정 요청 보내기 → 다음 컷</button>
          <button class="btn" id="btnCancel" type="button" hidden>요청 취소</button>
        </div>
        <div class="hint" id="sendHint">대사·카메라 칸을 고친 것도 함께 보내져요. 보내 두고 다음 컷을 보시면 됩니다.</div>
        <div class="reply" id="reply" hidden></div>
      </div>
      <div class="field" id="f-lines">
        <label for="in-lines">대사·지문 <button class="linkbtn" type="button" data-reset="lines">원래대로</button></label>
        <textarea id="in-lines" rows="5"></textarea>
        <div class="hint">한 줄에 하나 · <b>화자: (지문) 대사</b> · <b>화자 N:</b> 나레이션 · <b>화자 O.S.:</b> 화면 밖 · <b>▷</b> 지문 · <b>SFX</b> 효과음</div>
        <div class="orig">원래 <span data-orig="lines"></span></div>
      </div>
      <div class="field" id="f-cam">
        <label for="in-cam"><span data-label="cam">카메라</span> <button class="linkbtn" type="button" data-reset="cam">원래대로</button></label>
        <textarea id="in-cam" rows="2"></textarea>
        <div class="orig">원래 <span data-orig="cam"></span></div>
      </div>
      <div class="field" id="f-note">
        <label for="in-note"><span data-label="note">연출 메모</span> <button class="linkbtn" type="button" data-reset="note">원래대로</button></label>
        <textarea id="in-note" rows="2"></textarea>
        <div class="orig">원래 <span data-orig="note"></span></div>
      </div>
      <div class="field" id="f-tag">
        <label for="in-tag"><span data-label="tag">시점 태그</span> <button class="linkbtn" type="button" data-reset="tag">원래대로</button></label>
        <textarea id="in-tag" rows="2"></textarea>
        <div class="orig">원래 <span data-orig="tag"></span></div>
      </div>
    </aside>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="box">
    <b id="mtitle">수정 목록</b>
    <span class="hint" id="mhint">채팅에 붙여 넣어도 반영돼요.</span>
    <textarea id="mtext" readonly></textarea>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button class="btn" id="mcopy" type="button">다시 복사</button>
      <button class="btn primary" id="mclose" type="button">닫기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./supabase-adapter.js"></script>
<script>
const DATA = {"key":"ssiat-ep04","title":"씨앗도둑 4화 스토리보드 리뷰","chips":[["카메라","ARRI Alexa Mini LF"],["렌즈","Blackwing7 구면"],["원문","Drive v1 · 38컷"]],"fieldLabels":{"cam":"앵글 · 렌즈","note":"장면 · 액션","tag":"카메라 · 시점"},"scenes":{"4-1":"4화 1씬 · 떡볶이집 · 과거 (대학 시절, 낮)","4-2":"4화 2씬 · 떡볶이집 · 현재 (\"15년 후\", 낮) · 같은 테이블","4-3":"4화 3씬 · 거리 (낮)","4-4":"4화 4씬 · 진료실 (낮) · 1화 #1 대칭 셋업 · 클로에 책상 뒤, 에이바 좌 · 라이언 우"},"cuts":[{"id":"4-1-1","sc":"4-1","cam":"와이드 · 가게 밖 창 너머 · 창틀 프레임 · 고정 (↔ 4-2-1 매치)","note":"a small Korean snack bar in an American Koreatown, seen from the sidewalk outside through its front window. The window frame and blank vinyl film shapes on the glass (no legible letters) form a frame within the frame. Inside, a two-seat table right against the window, a red-sauce rice-cake dish and fried seaweed rolls on the table, a blank menu board on the back wall.","tag":"wide shot, eye level, static, from outside the window; the glass and its reflections slightly veil the scene — a peeping, voyeuristic framing.","lines":"▷ two college girls at the window table, mid-conversation; the girl on the right is lively and animated as if greeting an old friend.","v":1},{"id":"4-1-2","sc":"4-1","cam":"MCU · 아이레벨","note":"inside a small Korean snack bar, window table, daylight from the window at screen-right, blank menu board softly out of focus behind.","tag":"medium close-up, eye level, static, Chloe alone in frame.","lines":"▷ Chloe eats rice cakes from the shared dish with chopsticks, back hunched, shoulders rounded, looking down at the food, mumbling a casual reply.","v":1},{"id":"4-1-3","sc":"4-1","cam":"인서트 ECU · 탑다운 (↔ 4-2-5 매치)","note":"a plate of fried seaweed rolls on a worn snack-bar table, a dish of rice cakes in sauce beside it.","tag":"extreme close-up insert, straight top-down, static, only the plate and one hand with chopsticks in frame.","lines":"▷ a young woman's hand holds chopsticks and idly pokes and turns a fried seaweed roll without picking it up — restless, distracted.","v":1},{"id":"4-1-4","sc":"4-1","cam":"OTS 에이바 어깨 너머 → 클로에","note":"inside a small Korean snack bar, window table, daylight from the window.","tag":"over-the-shoulder shot from behind Ava (her dark ponytail and shoulder as a foreground occluder on screen-right) looking across the table at Chloe, eye level, static.","lines":"▷ Chloe stares straight at Ava, unblinking, studying her face while asking a question; chopsticks paused in her hand.","v":1},{"id":"4-1-5","sc":"4-1","cam":"MCU · 아이레벨","note":"inside a small Korean snack bar, window table, soft daylight on her face from screen-left.","tag":"medium close-up, eye level, static, Ava alone in frame.","lines":"▷ Ava looks down and to the side, slightly sullen, forcing a small shrug as she answers; shoulders a little dropped.","v":1},{"id":"4-1-6","sc":"4-1","cam":"CU · 아이레벨 (↔ 4-2-6 매치)","note":"inside a small Korean snack bar, window table, daylight.","tag":"close-up, eye level, static, Chloe's face filling the frame, slightly off-center to screen-left.","lines":"▷ Chloe frowns slightly at her friend — a mix of \"I'll scold you\" and real worry, brows drawn together, lips pressed, leaning in a little.","v":1},{"id":"4-1-7","sc":"4-1","cam":"CU · 아이레벨","note":"inside a small Korean snack bar, window table, daylight.","tag":"close-up, eye level, static, Ava's face and hands.","lines":"▷ Ava covers her face with both hands as she bursts into tears; fingers pressed over her eyes, shoulders shaking, mouth open in a sob beneath her hands.","v":1},{"id":"4-1-8","sc":"4-1","cam":"CU · 정면 아이레벨 · 85mm · 푸시인 (가면 비트 ①)","note":"inside a small Korean snack bar, window table, daylight; background softly out of focus like an 85mm portrait lens.","tag":"close-up, dead-on frontal, eye level, face centered and filling the frame, shallow depth of field.","lines":"▷ Chloe faces the camera directly. Her mouth and brows perform concern for her crying friend, but her eyes are flat and appraising — measuring, calculating, cold behind the glasses. A mask of worry over a judging gaze.","v":1},{"id":"4-1-9","sc":"4-1","cam":"와이드 · 딥포커스 · 역광 (깊은 공간의 접근)","note":"inside a small Korean snack bar; the window table in the foreground, the shop interior receding deep behind it, bright backlight from the far entrance.","tag":"wide shot, eye level, deep focus, static, backlit.","lines":"▷ foreground — the two girls at the table, Ava still crying into her hands, Chloe leaning toward her. Background — behind Chloe's back, a tall young man's dark silhouette walks toward the table from deep in the shop, face not yet visible, holding a tissue in one hand. Neither girl has noticed him.","v":1},{"id":"4-1-10","sc":"4-1","cam":"미디엄 · 로우 · 에이바 시점 (R5 예외: 왕자)","note":"inside a small Korean snack bar, beside the window table, daylight haloing the man from behind.","tag":"medium shot from a low angle — the point of view of a seated girl looking up at a standing man; a bit of the tabletop in the bottom of frame.","lines":"▷ a young man holds out a folded tissue toward the camera with a relaxed, charming smile, looking down kindly at the viewer. He is lit like a prince, slightly backlit.","v":1},{"id":"4-1-11","sc":"4-1","cam":"MCU · 아이레벨","note":"inside a small Korean snack bar, daylight.","tag":"medium close-up, eye level, static.","lines":"▷ the young man flashes a bright, fresh smile toward the table, then is caught in the moment of coolly turning away — body already half-rotated, head still half toward the girls.","v":1},{"id":"4-1-12","sc":"4-1","cam":"CU 프로필 · 후경 아웃포커스 라이언 뒷모습","note":"inside a small Korean snack bar, daylight.","tag":"close-up profile of Chloe in sharp focus on screen-left, looking toward screen-right; behind her, soft out-of-focus, the back of a young man walking away toward the exit.","lines":"▷ Chloe has whipped her head around to stare after the departing man — mouth slightly open, eyes wide behind her glasses, shocked, almost disbelieving.","v":1},{"id":"4-1-13","sc":"4-1","cam":"투샷 · 아이레벨"," const LEGACY = { fix: 'draft', redraw: 'draft' };
const ORDER = ['todo', 'draft', 'requested', 'working', 'done', 'ok'];
const stKey = k => LEGACY[k] || (ST[k] ? k : 'todo');
const stOf = k => ST[stKey(k)];
const FIELDS = ['cam', 'note', 'tag', 'lines'];
const CUTS = DATA.cuts;
const DEF = Object.fromEntries(CUTS.map(c => [c.id, c]));
const $ = id => document.getElementById(id);

let state = {};             // id -> server doc (merged with my pending edits)
let cur = 0;
let db = null, col = null, metaCol = null;
let agent = null;           // meta/agent doc
let showOld = false;
const timers = {}, pending = {}, chains = {};

function val(id, f) {
  const s = state[id];
  if (s && typeof s[f] === 'string') return s[f];
  if (f === 'status') return 'todo';
  if (f === 'memo' || f === 'reply' || f === 'img' || f === 'prevImg') return '';
  return DEF[id][f];
}
const status = id => stKey(val(id, 'status'));
function changed(id, f) { return FIELDS.includes(f) && val(id, f) !== DEF[id][f]; }
function hasEdits(id) { return !!val(id, 'memo').trim() || FIELDS.some(f => changed(id, f)); }
const signedImages = new Map();
function imageLink(value) {
  if (!value) return '';
  if (!value.startsWith('storage:')) return value;
  return signedImages.get(value.slice(8)) || PLACEHOLDER;
}
function imgSrc(c) { return imageLink(val(c.id, 'img') || c.img || ('p/' + c.id + '.jpg?v=' + (c.v || 1))); }
async function resolveCutImage(value) {
  if (!value || !value.startsWith('storage:') || !window.storyboardDB?.resolveImage) return;
  const path = value.slice(8);
  try {
    const url = await window.storyboardDB.resolveImage(path);
    signedImages.set(path, url);
    renderStage(); renderRail();
    if ($('app').classList.contains('gridmode')) renderGrid();
  } catch (e) { setSave('이미지 접근 실패: ' + e.message, true); }
}
const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#eee9df"/><path d="M80 70H1520V830H80Z" fill="none" stroke="#bcb6ac" stroke-width="2" stroke-dasharray="12 12"/><text x="800" y="425" fill="#857d73" font-size="46" font-family="sans-serif" text-anchor="middle">스토리보드 이미지 준비 중</text><text x="800" y="485" fill="#857d73" font-size="25" font-family="sans-serif" text-anchor="middle">p/컷ID.jpg 파일 추가 시 자동 표시됩니다</text></svg>');
function imageFallback(img) { if (!img.src.startsWith('data:')) img.src = PLACEHOLDER; }
document.addEventListener('error', e => { if (e.target instanceof HTMLImageElement) imageFallback(e.target); }, true);
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }
function ago(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? '방금' : m < 60 ? m + '분 전' : Math.round(m / 60) + '시간 전';
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2200); }

// ---------- persistence: field-level patches, so Claude's fields (img, reply, status) are never overwritten ----------
const LSKEY = 'sbreview-' + (DATA.key || 'board');
function loadLocal() { try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch (e) { return {}; } }
function saveLocal() { try { localStorage.setItem(LSKEY, JSON.stringify(state)); } catch (e) {} }
function setSave(t, err) { const el = $('save'); el.textContent = t; el.classList.toggle('err', !!err); }

function flush(id) {
  clearTimeout(timers[id]); delete timers[id];
  const patch = pending[id]; delete pending[id];
  if (!patch) return Promise.resolve();
  if (!col) { saveLocal(); setSave('이 브라우저에만 저장됨'); return Promise.resolve(); }
  setSave('저장 중…');
  const ref = col.doc(id);
  chains[id] = (chains[id] || Promise.resolve())
    .then(() => ref.update(patch))
    .then(() => setSave('저장됨'))
    .catch(e => { setSave('저장 실패 (' + (e && e.code || '알 수 없음') + ') — 수정 목록 복사로 보내 주세요', true); saveLocal(); });
  return chains[id];
}
function edit(id, patch, now) {
  if (document.body.dataset.role === 'viewer') { toast('읽기 전용 계정입니다'); return Promise.resolve(); }
  patch = Object.assign({}, patch, { updatedAt: new Date().toISOString() });
  state[id] = Object.assign({}, state[id] || {}, patch);
  pending[id] = Object.assign(pending[id] || {}, patch);
  clearTimeout(timers[id]);
  if (now) return flush(id);
  timers[id] = setTimeout(() => flush(id), 600);
  return Promise.resolve();
}

// ---------- rendering ----------
function renderHeader() {
  $('title').textContent = DATA.title || '보드 리뷰';
  document.title = DATA.title || '보드 리뷰';
  $('chips').innerHTML = (DATA.chips || []).map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join(' ');
  const L = DATA.fieldLabels || {};
  document.querySelectorAll('[data-label]').forEach(el => { if (L[el.dataset.label]) el.textContent = L[el.dataset.label]; });
}
function renderCounts() {
  const n = {}; ORDER.forEach(k => n[k] = 0);
  CUTS.forEach(c => n[status(c.id)]++);
  $('counts').innerHTML = ORDER.filter(k => n[k] || k === 'todo' || k === 'ok').map(k =>
    `<span class="chip"><span class="dot" style="background:${ST[k].c}"></span>${ST[k].t} <b>${n[k]}</b></span>`).join('');
}
function renderAgent() {
  const el = $('agent'), t = $('agentTxt');
  el.className = 'agent';
  if (!col) { t.textContent = '공유 저장소 연결 전 · 이 기기에 임시 저장'; return; }
  const busy = CUTS.some(c => status(c.id) === 'working');
  if (!agent || agent.mode !== 'on') { t.textContent = 'AI 자동 반영 연결 전'; return; }
  const age = (Date.now() - Date.parse(agent.lastCheck || 0)) / 60000;
  const every = agent.everyMin || 2;
  if (age > every * 3 + 2) { el.classList.add('stale'); t.textContent = `AI 확인 지연 (${ago(agent.lastCheck)})`; return; }
  el.classList.add(busy ? 'busy' : 'on');
  t.textContent = busy ? 'AI 반영 중…' : `AI 연결됨 · ${ago(agent.lastCheck)} 확인 · ${every}분마다`;
}
function renderRail() {
  let html = '', sc = null;
  CUTS.forEach((c, i) => {
    if (c.sc !== sc) { sc = c.sc; html += `<h2>${esc(DATA.scenes[sc] || '')}</h2>`; }
    const s = stOf(val(c.id, 'status'));
    html += `<button class="thumb${i === cur ? ' on' : ''}" type="button" data-i="${i}" aria-label="${c.id} ${s.t}">
      <span class="stripe" style="background:${s.c}"></span>
      <span class="body"><img src="${esc(imgSrc(c))}" alt="" loading="lazy"><span class="meta"><b>${c.id}</b><span>${s.t}</span></span></span></button>`;
  });
  $('rail').innerHTML = html;
  const on = $('rail').querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function parseLine(l) {
  l = l.trim(); if (!l) return null;
  if (l.startsWith('▷')) return { k: 'act', t: l.slice(1).trim() };
  if (/^SFX\s/i.test(l)) return { k: 'sfx', t: l.slice(3).trim() };
  const m = l.match(/^([^:：]{1,20})[:：]\s*(?:\(([^)]*)\)\s*)?(.*)$/);
  if (!m) return { k: 'act', t: l };
  const spk = m[1].trim();
  return { k: / N$/.test(spk) ? 'n' : 'say', spk, par: m[2] || '', t: m[3] };
}
function renderPreview() {
  const c = CUTS[cur];
  const lines = val(c.id, 'lines').split('\n').map(parseLine).filter(Boolean);
  const camL = (DATA.fieldLabels && DATA.fieldLabels.cam) || '카메라';
  let h = `<div class="cam">${esc(camL)} · ${esc(val(c.id, 'cam'))}${val(c.id, 'note') ? ' — ' + esc(val(c.id, 'note')) : ''}</div>`;
  lines.forEach(L => {
    if (L.k === 'act') h += `<div class="act">▷ ${esc(L.t)}</div>`;
    else if (L.k === 'sfx') h += `<div class="act">SFX ${esc(L.t)}</div>`;
    else h += `<div class="ln ${L.k}"><span class="spk">${esc(L.spk)}</span><span>${L.par ? `<span class="par">(${esc(L.par)})</span> ` : ''}${esc(L.t)}</span></div>`;
  });
  $('preview').innerHTML = h;
}
function renderSheet() {
  const c = CUTS[cur], id = c.id, k = status(id), s = ST[k];
  FIELDS.forEach(f => {
    $('f-' + f).classList.toggle('changed', changed(id, f));
    document.querySelector(`[data-orig="${f}"]`).textContent = DEF[id][f] || '(비어 있음)';
  });
  const b = $('stbadge'); b.className = 'stbadge ' + k;
  b.querySelector('.dot').style.background = s.c; b.lastElementChild.textContent = s.t; b.style.color = s.c;
  $('seg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === k));
  const edits = hasEdits(id);
  const send = $('btnSend'), cancel = $('btnCancel'), hint = $('sendHint');
  cancel.hidden = k !== 'requested';
  if (k === 'requested') { send.disabled = true; send.textContent = '요청 기록됨 · AI 연결 대기'; }
  else if (k === 'working') { send.disabled = true; send.textContent = 'AI가 반영하는 중…'; }
  else { send.disabled = !edits; send.textContent = k === 'done' ? '다시 요청 보내기 → 다음 컷' : '수정 요청 보내기 → 다음 컷'; }
  hint.hidden = k === 'requested' || k === 'working';
  hint.textContent = edits ? '수정 요청과 고친 대사·카메라가 함께 보내져요. 보내 두고 다음 컷을 보시면 됩니다.'
                           : '수정 요청을 적거나 대사·카메라를 고치면 보낼 수 있어요.';
  const reply = val(id, 'reply'), r = $('reply');
  r.hidden = !(reply || k === 'requested' || k === 'working');
  r.className = 'reply ' + (k === 'working' ? 'working' : k === 'requested' ? 'requested' : 'done');
  r.textContent = k === 'requested' ? '요청 기록됨 · ' + ago(val(id, 'requestedAt')) + (reply ? '\n지난 반영: ' + reply : '')
                : k === 'working' ? 'AI: ' + (reply || '반영 중…')
                : 'AI: ' + reply + (val(id, 'doneAt') ? '  (' + ago(val(id, 'doneAt')) + ')' : '');
  $('btnOld').hidden = !val(id, 'prevImg');
}
function renderForm(force) {
  const c = CUTS[cur];
  const map = { 'in-cam': 'cam', 'in-note': 'note', 'in-tag': 'tag', 'in-lines': 'lines', 'in-memo': 'memo' };
  Object.entries(map).forEach(([el, f]) => {
    const node = $(el);
    if (force || document.activeElement !== node) node.value = val(c.id, f);
  });
  renderSheet();
}
function renderStage() {
  const c = CUTS[cur];
  $('cutid').textContent = c.id;
  $('scene').textContent = (DATA.scenes[c.sc] || '') + ` · ${cur + 1} / ${CUTS.length}`;
  const src = showOld && val(c.id, 'prevImg') ? imageLink(val(c.id, 'prevImg')) : imgSrc(c);
  if ($('img').getAttribute('src') !== src) $('img').src = src;
  $('frame').classList.toggle('old', showOld && !!val(c.id, 'prevImg'));
  $('img').alt = c.id + ' 보드 그림';
  renderPreview();
}
function renderGrid() {
  let html = '', sc = null;
  CUTS.forEach((c, i) => {
    if (c.sc !== sc) { if (sc !== null) html += '</div></section>'; sc = c.sc; html += `<section><h2>${esc(DATA.scenes[sc] || '')}</h2><div class="cards">`; }
    const s = stOf(val(c.id, 'status'));
    const first = val(c.id, 'lines').split('\n')[0] || '';
    const memo = val(c.id, 'memo');
    html += `<button class="card" type="button" data-i="${i}"><img src="${esc(imgSrc(c))}" alt="" loading="lazy">
      <span class="cbody" style="border-top-color:${s.c}"><span class="top"><b>${c.id}</b><span class="chip"><span class="dot" style="background:${s.c}"></span>${s.t}</span></span>
      <span class="txt">${esc(first)}</span>${memo ? `<span class="memo-p">요청: ${esc(memo)}</span>` : ''}</span></button>`;
  });
  html += '</div></section>';
  $('grid').innerHTML = html;
}
function renderAll(force) { renderCounts(); renderAgent(); renderRail(); renderStage(); renderForm(force); if ($('app').classList.contains('gridmode')) renderGrid(); }
function go(i) { cur = (i + CUTS.length) % CUTS.length; showOld = false; renderAll(true); }
function updateRailItem(id) {
  const i = CUTS.findIndex(c => c.id === id), t = $('rail').querySelector(`[data-i="${i}"]`); if (!t) return;
  const s = stOf(val(id, 'status')); t.querySelector('.stripe').style.background = s.c; t.querySelector('.meta span').textContent = s.t;
}

// ---------- events ----------
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = CUTS[cur].id, k = status(id);
  if (k === 'requested' || k === 'working') { toast('요청 처리 중에는 바꿀 수 없어요. 먼저 요청을 취소해 주세요.'); return; }
  edit(id, { status: b.dataset.k }); renderCounts(); updateRailItem(id); renderSheet();
});
[['in-cam', 'cam'], ['in-note', 'note'], ['in-tag', 'tag'], ['in-lines', 'lines'], ['in-memo', 'memo']].forEach(([el, f]) => {
  $(el).addEventListener('input', () => {
    const id = CUTS[cur].id, k = status(id), patch = { [f]: $(el).value };
    if (k === 'todo' || k === 'ok' || k === 'done') patch.status = 'draft';
    edit(id, patch);
    if (!hasEdits(id) && status(id) === 'draft') edit(id, { status: 'todo' });
    renderSheet(); renderCounts(); renderPreview(); updateRailItem(id);
  });
});
document.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
  const f = b.dataset.reset, id = CUTS[cur].id;
  edit(id, { [f]: DEF[id][f] });
  if (!hasEdits(id) && status(id) === 'draft') edit(id, { status: 'todo' });
  renderForm(true); renderPreview(); renderCounts(); updateRailItem(id);
}));
$('btnSend').addEventListener('click', async () => {
  const id = CUTS[cur].id;
  if (!hasEdits(id)) return;
  const at = new Date().toISOString();
  await edit(id, { status: 'requested', requestedAt: at }, true);
  toast(`${id} 수정 요청이 기록됐습니다`);
  go(cur + 1);
});
$('btnCancel').addEventListener('click', () => {
  const id = CUTS[cur].id; if (status(id) !== 'requested') return;
  edit(id, { status: 'draft' }, true); renderCounts(); updateRailItem(id); renderSheet();
});
const holdOld = on => { showOld = on; renderStage(); };
$('btnOld').addEventListener('pointerdown', () => holdOld(true));
$('btnUpload').addEventListener('click', () => {
  if (document.body.dataset.role === 'viewer') { toast('조회 전용 계정입니다.'); return; }
  if (!col || !window.storyboardDB?.uploadImage) { toast('Supabase 연결 후 업로드할 수 있습니다.'); return; }
  $('imageUpload').click();
});
$('imageUpload').addEventListener('change', async event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const c = CUTS[cur];
  const btn = $('btnUpload');
  btn.disabled = true; btn.textContent = '업로드 중…';
  try {
    const previous = val(c.id, 'img') || c.img || '';
    const path = await window.storyboardDB.uploadImage(c.id, file);
    const nextImage = 'storage:' + path;
    await edit(c.id, {img:nextImage, prevImg:previous, updatedAt:new Date().toISOString()}, true);
    await resolveCutImage(nextImage);
    renderAll(true);
    toast(c.id + ' 그림 등록 완료');
  } catch (e) { toast('업로드 실패: ' + (e?.message || String(e))); }
  finally { btn.disabled = false; btn.textContent = '그림 업로드'; event.target.value = ''; }
});
['pointerup', 'pointerleave', 'blur'].forEach(ev => $('btnOld').addEventListener(ev, () => showOld && holdOld(false)));
$('rail').addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) go(+t.dataset.i); });
$('grid').addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) { $('app').classList.remove('gridmode'); $('btnGrid').textContent = '전체 보기'; go(+t.dataset.i); } });
$('prev').addEventListener('click', () => go(cur - 1));
$('next').addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || $('modal').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
});
$('btnGrid').addEventListener('click', () => {
  const on = $('app').classList.toggle('gridmode');
  $('btnGrid').textContent = on ? '한 컷씩 보기' : '전체 보기';
  if (on) renderGrid();
});
$('btnWide').addEventListener('click', () => {
  const on = $('main').classList.toggle('wide');
  $('btnWide').textContent = on ? '편집 열기' : '그림 크게';
});
const FL = { cam: '카메라', note: '연출 메모', tag: '시점 태그', lines: '대사' };
function summary() {
  const out = [];
  CUTS.forEach(c => {
    const k = status(c.id);
    if (!['draft', 'requested'].includes(k)) return;
    out.push(`[${c.id}] ${ST[k].t}`);
    const memo = val(c.id, 'memo'); if (memo) out.push('  요청: ' + memo);
    FIELDS.forEach(f => { if (changed(c.id, f)) out.push(`  ${((DATA.fieldLabels || {})[f]) || FL[f]}: ` + val(c.id, f).replace(/\n/g, ' / ')); });
  });
  return out.length ? out.join('\n') : '보낼 수정 사항이 없어요.';
}
$('btnCopy').addEventListener('click', async () => {
  const t = summary();
  $('mtext').value = t; $('modal').classList.add('open');
  try { await navigator.clipboard.writeText(t); $('mhint').textContent = '복사했어요. 채팅에 붙여 넣어도 반영돼요.'; }
  catch (e) { $('mhint').textContent = '자동 복사가 막혀 있어요. 아래 글을 선택해서 복사해 주세요.'; $('mtext').select(); }
});
$('mcopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('mtext').value); $('mhint').textContent = '복사했어요.'; } catch (e) { $('mtext').select(); } });
$('mclose').addEventListener('click', () => $('modal').classList.remove('open'));
setInterval(() => { renderAgent(); if (['requested', 'working', 'done'].includes(status(CUTS[cur].id))) renderSheet(); }, 30000);

// ---------- boot ----------
renderHeader();
state = loadLocal();
renderAll(true);
(async () => {
  try { db = window.storyboardDB && await window.storyboardDB.use('db'); } catch (e) { db = null; }
  if (!db) { setSave('이 브라우저에만 저장됨 — 공유 DB 설정 필요'); renderAgent(); return; }
  col = db.collection('cuts'); metaCol = db.collection('meta');
  state = {}; renderAll(true);
  setSave('저장소 연결됨');
  col.onSnapshot(snap => {
    let touched = false, curTouched = false, curImg = false;
    const curId = CUTS[cur].id;
    snap.docs.forEach(d => {
      const body = d.data(); if (!body) return;
      const mine = pending[d.id] || {};
      const prev = state[d.id] || {};
      state[d.id] = Object.assign({}, body, mine);   // keep my not-yet-saved fields on top
      resolveCutImage(body.img);
      resolveCutImage(body.prevImg);
      touched = true;
      if (d.id === curId) { curTouched = true; if ((prev.img || '') !== (body.img || '')) curImg = true; }
      if (prev.status !== body.status && body.status === 'done' && prev.status) toast(`${d.id} 반영됐어요`);
    });
    if (!touched) return;
    renderCounts(); renderAgent(); renderRail();
    if (curTouched) { if (curImg) renderStage(); else renderPreview(); renderForm(false); }
    if ($('app').classList.contains('gridmode')) renderGrid();
  }, err => { setSave('실시간 연결 끊김 (' + (err && err.code) + ') — 새로고침해 주세요', true); });
  metaCol.onSnapshot(snap => {
    snap.docs.forEach(d => { if (d.id === 'agent') agent = d.data(); });
    renderAgent();
  }, () => {});
})();
</script>
</body>
</html>
